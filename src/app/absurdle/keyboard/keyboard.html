<div class="row">
    @for (key of topRowKeys; track $index) {
    <absurdle-key [letter]="key" [isCorrect]="correctKeys.has(key)" [isIncorrect]="incorrectKeys.has(key)" [isMisplaced]="misplacedKeys.has(key)"></absurdle-key>
    }
</div>
<div class="row">
    @for (key of midRowKeys; track $index) {
    <absurdle-key [letter]="key" [isCorrect]="correctKeys.has(key)" [isIncorrect]="incorrectKeys.has(key)" [isMisplaced]="misplacedKeys.has(key)"></absurdle-key>
    }
</div>
<div class="row">
    <absurdle-key letter="⏎" class="large"></absurdle-key>
    @for (key of lowRowKeys; track $index) {
    <absurdle-key [letter]="key" [isCorrect]="correctKeys.has(key)" [isIncorrect]="incorrectKeys.has(key)" [isMisplaced]="misplacedKeys.has(key)"></absurdle-key>
    }
    <absurdle-key letter="⌫" class="large"></absurdle-key>
</div>
