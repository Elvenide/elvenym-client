<nav game>
    <button>
        <a href="/">
            <icon name="home" medium />
        </a>
    </button>
    <div class="logo">
        <div>A</div>
        <div>B</div>
        <div>S</div>
        <div>U</div>
        <div>R</div>
        <div>D</div>
        <div>L</div>
        <div>E</div>
    </div>
    <div class="separator"></div>
    <button>
        <icon name="outline:info" medium />
    </button>
    <button>
        <icon name="outline:leaderboard" medium />
    </button>
</nav>
<main game>
    @if (loaded()) {
        @for (guess of guesses(); track $index) {
        <absurdle-row [active]="guess[1] == activeRow" [word]="guess[0]" [shouldTypeAnimate]="isTyping" [shouldInvalidAnimate]="guess[1] == activeRow && isInvalid()" (winEvent)="onWin()"></absurdle-row>
        }
    }
    @else {
        Loading...
    }
    <div class="separator"></div>
    <absurdle-keyboard [correctKeys]="getCorrectKeys()" [incorrectKeys]="getIncorrectKeys()" [misplacedKeys]="getMisplacedKeys()"></absurdle-keyboard>
</main>
<footer game>
    Created by <a href="#">Elvenide</a>
</footer>
