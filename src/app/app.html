@if (!user.isDiscord() || user.isDiscordReady()) {

<!-- //Home Page -->
<nav home [style.display]="user.getPage() == 'home' ? 'flex' : 'none'">
    <a class="logo" href="/">
        <img width="32" height="32" src="logo.png" />
        lvenym
    </a>
    <avatar [url]="user.getAvatar()" [username]="user.getUsername()" />
</nav>
<main home [style.display]="user.getPage() == 'home' ? 'flex' : 'none'">
    <button class="absurdle" (click)="user.setPage('absurdle')">
        <div>
            <icon name="grid_on" medium />
            <p>Absurdle</p>
        </div>
    </button>
    <button class="collections"  (click)="user.setPage('collections')">
        <div>
            <icon name="web_stories" medium />
            <p>Collections</p>
        </div>
    </button>
    <button disabled class="coming-soon tether">
        <div>
            <icon name="link" medium />
            <p>Tether</p>
        </div>
    </button>
    <button disabled class="coming-soon swelling-bee">
        <div>
            <icon name="hive" medium />
            <p>Swelling Bee</p>
        </div>
    </button>
    <button disabled class="coming-soon trend-market">
        <div>
            <icon name="whatshot" medium />
            <p>Trend Market</p>
        </div>
    </button>
</main>
<!-- Home Page// -->



<!-- //Game Pages -->
<game-collections [style.display]="user.getPage() == 'collections' ? 'flex' : 'none'"></game-collections>
<game-absurdle [style.display]="user.getPage() == 'absurdle' ? 'flex' : 'none'"></game-absurdle>
<!-- Game Pages// -->

}
@else {
<!-- //Loading Indicator -->
<main game>
    <div class="loader"></div>
</main>
<!-- Loading Indicator// -->
}
